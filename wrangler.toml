name = "portoflio"
main = "./worker/index.ts"
compatibility_date = "2025-06-12"
compatibility_flags = ["nodejs_compat"]
routes = [
    { pattern = "irsyad.dev/*", zone_name = "irsyad.dev" },
    { pattern = "www.irsyad.dev/*", zone_name = "irsyad.dev" }
]

[assets]
directory = "./dist/"
binding = "ASSETS"
html_handling = "drop-trailing-slash"
not_found_handling = "404-page"

[[kv_namespaces]]
binding = "ATTIRE_KV"
id = "1e55c51c3897457ab72a294b2125cb9f"
# Apple Wallet pass images are bundled into the worker as ArrayBuffers
[[rules]]
type = "Data"
globs = ["**/*.png"]
fallthrough = false

# Pass signing secrets (set with `wrangler secret put`, or .dev.vars locally):
# PASS_TYPE_ID, APPLE_TEAM_ID, PASS_CERT_PEM, PASS_KEY_PEM, WWDR_CERT_PEM
